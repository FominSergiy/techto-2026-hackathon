<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservation AI service</title>
<style>
    :root { --bg: #fafafa; --text: #16181d; --muted: #737c8c; --line: #e4e6eb; --accent: #2457d6; --error: #b3261e; --row: #f2f4f8; }
    @media (prefers-color-scheme: dark) {
        :root { --bg: #111317; --text: #e8eaef; --muted: #8b94a5; --line: #272b33; --accent: #6b93ff; --error: #ff8a80; --row: #1a1d23; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 72px 16px 48px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { margin: 0 0 28px; font-size: 28px; font-weight: 650; letter-spacing: -0.02em; }
    input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--row); color: inherit; font: inherit; font-size: 16px; outline: none; }
    input:focus { border-color: var(--accent); }
    input:disabled { opacity: .7; }
    .bar { height: 2px; margin: 10px 2px 0; border-radius: 2px; overflow: hidden; }
    .bar.on { background: linear-gradient(90deg, transparent, var(--accent), transparent) 0 0 / 40% 100% no-repeat; animation: slide 1.1s linear infinite; }
    @keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }
    .note { margin: 14px 2px 0; color: var(--muted); font-size: 13px; }
    .note.error { color: var(--error); }
    .scroll { margin-top: 24px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
    td.price { white-space: nowrap; font-variant-numeric: tabular-nums; }
    td.price small { color: var(--muted); }
    td.phone { white-space: nowrap; }
    tbody tr:hover { background: var(--row); }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }
    td.phone a { color: var(--accent); }
    .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
    <h1>Reservation AI service</h1>
    <input id="prompt" type="text" autocomplete="off" autofocus aria-label="Reservation request">
    <div id="bar" class="bar"></div>
    <div id="note"></div>
    <div id="results"></div>
</main>

<script>
const $ = id => document.getElementById(id);

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// quoted: the rate for the dates · from: the lowest rate a page showed · estimated: a model's guess from the name
const PRICE_PREFIX = { quoted: "", from: "from ", estimated: "~" };
const PRICE_HINT = { quoted: "Rate found for these dates", from: "Lowest rate found on a web page", estimated: "Estimated from the hotel's name and area" };

function priceCell(hotel) {
    if (hotel.price == null) return '<span class="muted">—</span>';
    return `<span title="${PRICE_HINT[hotel.priceKind] || ""}">${PRICE_PREFIX[hotel.priceKind] ?? ""}${esc(hotel.price)} <small>${esc(hotel.currency)}</small></span>`;
}

// Phones are written differently in the search ("(416) 555-0101") and the call script ("+14165550101"): compare the last 10 digits
const digits = phone => String(phone ?? "").replace(/\D/g, "").slice(-10);

// What the call to one hotel came to: empty for hotels that are not being called
function callCell(hotel, job, calls) {
    if (!job || !job.phones.some(phone => digits(phone) === digits(hotel.phone))) return '<span class="muted">—</span>';
    const call = calls.find(item => digits(item.phone) === digits(hotel.phone));
    // no result yet: on the call or still in the queue; after the run: never dialed (enough prices came in first)
    if (!call) return `<span class="muted">${job.finished ? "not called" : "…"}</span>`;
    const quoted = call.price ? ` <small>${esc(call.price)}</small>` : "";
    if (call.status === "booked") return `<strong>booked</strong>${quoted}${call.number ? ` <small>#${esc(call.number)}</small>` : ""}`;
    if (call.status === "priced") return `quoted${quoted}`;
    return `<span class="muted">${esc(call.status === "failed" ? "no price" : call.status)}</span>`;
}

function render(hotels, job = null, calls = []) {
    if (!hotels.length) {
        $("results").innerHTML = "";
        $("note").innerHTML = '<p class="note">No hotels found.</p>';
        return;
    }
    const rows = hotels.map(hotel => `
        <tr>
            <td>${hotel.url ? `<a href="${esc(hotel.url)}" target="_blank" rel="noopener">${esc(hotel.name)}</a>` : esc(hotel.name)}</td>
            <td class="price">${priceCell(hotel)}</td>
            <td class="phone">${hotel.phone ? `<a href="tel:${esc(hotel.phone.replace(/[^+\d]/g, ""))}">${esc(hotel.phone)}</a>` : '<span class="muted">—</span>'}</td>
            <td>${esc(hotel.address) || '<span class="muted">—</span>'}</td>
            ${job ? `<td class="call">${callCell(hotel, job, calls)}</td>` : ""}
        </tr>`).join("");
    $("results").innerHTML = `<div class="scroll"><table><thead><tr><th>Hotel</th><th>Price / night</th><th>Phone</th><th>Address</th>${job ? "<th>Call</th>" : ""}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

// After the search the server phones the top hotels in parallel and emails the cheapest booking: follow that until it is over
async function followCalls(hotels, job) {
    job.finished = false;
    $("bar").classList.add("on");
    $("note").insertAdjacentHTML("beforeend", '<p class="note" id="callNote">Calling hotels…</p>');
    for (;;) {
        await sleep(3000);
        let status;
        try {
            const response = await fetch(`/api/reservation/status?id=${encodeURIComponent(job.id)}`);
            status = await response.json();
            if (!response.ok) throw new Error(status.error);
        } catch (error) {
            $("callNote").className = "note error";
            $("callNote").textContent = error.message;
            return;
        }
        job.finished = status.state !== "calling";
        render(hotels, job, status.calls);
        const note = $("callNote");
        if (!job.finished) {
            note.textContent = `Calling hotels… ${status.priced} of ${status.want} prices so far.`;
            continue;
        }
        if (status.state === "failed") {
            note.className = "note error";
            note.textContent = `The calls failed: ${status.error}`;
        } else if (!status.chosen) {
            note.textContent = `${status.priced} hotel${status.priced === 1 ? "" : "s"} quoted a price, but none confirmed a booking, so no email was sent.`;
        } else {
            const { hotel, number, price } = status.chosen;
            note.textContent = `Booked ${hotel}${price ? ` at ${price}` : ""}${number ? `, confirmation #${number}` : ""}. ${status.emailed ? "Confirmation emailed." : "The confirmation email was NOT sent."}`;
            if (!status.emailed) note.className = "note error";
        }
        return;
    }
}

async function search() {
    const input = $("prompt");
    const prompt = input.value.trim();
    if (!prompt) return;

    input.disabled = true;
    $("bar").classList.add("on");
    $("note").innerHTML = "";
    $("results").innerHTML = "";

    try {
        const response = await fetch("/api/reservation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        render(data.hotels, data.job);
        if (data.warnings.length) {
            $("note").innerHTML = data.warnings.map(warning => `<p class="note error">${esc(warning)}</p>`).join("") + $("note").innerHTML;
        }
        // The input stays locked until the calls are over, so a second Enter cannot start another round of phone calls
        if (data.job) await followCalls(data.hotels, data.job);
    } catch (error) {
        $("note").innerHTML = `<p class="note error">${esc(error.message)}</p>`;
    } finally {
        input.disabled = false;
        $("bar").classList.remove("on");
        input.focus();
    }
}

$("prompt").addEventListener("keydown", event => {
    if (event.key === "Enter") search();
});
</script>
</body>
</html>
