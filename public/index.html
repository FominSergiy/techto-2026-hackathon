<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Search</title>
<style>
    :root {
        --bg: #f6f7f9; --card: #fff; --text: #1c2430; --muted: #6b7686; --border: #dfe3ea;
        --accent: #2457d6; --accent-text: #fff; --error: #b3261e; --row: #f0f3f9; --ok: #1a7f37; --warn: #9a6700;
    }
    @media (prefers-color-scheme: dark) {
        :root { --bg: #14171c; --card: #1c2027; --text: #e7eaf0; --muted: #8f9aab; --border: #2f3641; --accent: #6b93ff; --accent-text: #0b1020; --error: #ff8a80; --row: #232833; --ok: #56d364; --warn: #e3b341; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
    main { max-width: 1200px; margin: 0 auto; }
    h1 { margin: 0 0 16px; font-size: 22px; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    textarea { width: 100%; min-height: 90px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: inherit; font: inherit; resize: vertical; }
    .bar { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    button { padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    button.secondary { background: var(--row); color: var(--text); border: 1px solid var(--border); }
    .review { border-color: var(--accent); }
    .muted { color: var(--muted); font-size: 13px; }
    .error { color: var(--error); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { background: var(--row); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
    tbody tr:hover { background: var(--row); }
    td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    a { color: var(--accent); }
    .sources { display: flex; gap: 8px 20px; flex-wrap: wrap; margin-bottom: 12px; }
    .sources label { display: flex; gap: 6px; align-items: baseline; cursor: pointer; }
    .sources label.off { cursor: not-allowed; opacity: .65; }
    .badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border: 1px solid currentColor; border-radius: 999px; white-space: nowrap; }
    .badge.free { color: var(--ok); }
    .badge.tier { color: var(--warn); }
    .sources .places { border-left: 1px solid var(--border); padding-left: 20px; }
    details { margin-top: 12px; }
    pre { margin: 8px 0 0; padding: 10px; background: var(--bg); border-radius: 8px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<main>
    <h1>Hotel Search</h1>

    <div class="card">
        <div id="sources" class="sources muted">Loading sources…</div>
        <textarea id="prompt" placeholder="e.g. Cheapest hotels in Aurora from 2026-11-20 to 2026-11-22 for 2 adults under 250 CAD (the region is always Ontario)"></textarea>
        <div class="bar">
            <button id="run">Review prompt</button>
            <span id="status" class="muted">Ctrl/Cmd+Enter to review. You see the full prompt before anything runs. Tick the APIs to use above.</span>
        </div>
    </div>

    <div id="review"></div>
    <div id="output"></div>

    <div class="card">
        <h2>Backboard (web search)</h2>
        <textarea id="bbPrompt" placeholder="e.g. Cheapest hotels in Aurora for 2026-11-20, 1 night, 2 adults, under 250 CAD, with phone numbers (the region is always Ontario)"></textarea>
        <div class="bar">
            <button id="bbRun">Review prompt</button>
            <span id="bbStatus" class="muted">Separate from the search above: a web-search model answers directly. Prices are hints, not API rates. Ctrl/Cmd+Enter to review.</span>
        </div>
    </div>

    <div id="bbReview"></div>
    <div id="bbOutput"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const COLUMNS = [
    ["Hotel", h => h.name],
    ["City", h => h.city],
    ["Address", h => h.address],
    ["Phone", h => h.phone && `<a href="tel:${h.phone.replace(/[^+\d]/g, "")}">${esc(h.phone)}</a>`, true],
    ["Price / night", h => h.nightlyPrice != null ? `${h.nightlyPrice} ${h.currency}` : "no price", "num"],
    ["Total", h => h.totalPrice != null ? `${h.totalPrice} ${h.currency}` : "", "num"],
    ["Rating", h => h.rating != null ? `${h.rating} (${h.reviews ?? "?"})` : "", "num"],
    ["Source", h => h.source],
    ["Other offers", h => h.otherOffers],
    ["Link", h => h.url && `<a href="${esc(h.url)}" target="_blank" rel="noopener">open</a>`, true]
];

function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderTable(hotels) {
    const head = COLUMNS.map(([label]) => `<th>${label}</th>`).join("");
    // Columns flagged true return ready-made (already escaped) HTML
    const rows = hotels.map(hotel => "<tr>" + COLUMNS.map(([, get, kind]) => {
        const value = get(hotel);
        return `<td${kind === "num" ? ' class="num"' : ""}>${kind === true ? value || "" : esc(value)}</td>`;
    }).join("") + "</tr>").join("");
    return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// Source failures are logged as "<source> failed: <reason>" - show them instead of burying them in the run log
function failuresIn(log) {
    return (log || "").split("\n").filter(line => /^\w+ failed: /.test(line));
}

function render(result) {
    const failures = failuresIn(result.log);
    const usage = result.usage ? ` · ${result.usage.input_tokens + result.usage.output_tokens} prompt-parsing tokens` : "";
    const chips = result.args.map(arg => `<span class="chip">${esc(arg)}</span>`).join("");
    $("output").innerHTML = `
        <div class="card">
            <div class="chips">${chips || '<span class="chip">default settings</span>'}</div>
            ${failures.map(line => `<p class="error">${esc(line)}</p>`).join("")}
            ${result.hotels.length ? renderTable(result.hotels)
                : failures.length ? "<p>No hotels came back because the source(s) above failed.</p>"
                : "<p>No hotels matched. Try loosening the filters.</p>"}
            <p class="muted">${result.hotels.length} hotels in ${result.seconds.toFixed(1)}s · prompt parsed by ${esc(result.parser)}${usage}</p>
            <details><summary class="muted">Run log</summary><pre>${esc(result.log)}</pre></details>
        </div>`;
}

async function run(text) {
    const button = $("run");
    const started = Date.now();
    button.disabled = true;
    $("output").innerHTML = "";
    const timer = setInterval(() => $("status").textContent = `Searching… ${Math.round((Date.now() - started) / 1000)}s (sources run in parallel, can take a minute)`, 500);

    try {
        const response = await fetch("/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: text, reviewed: true, ...pickedSources() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        render(data);
        $("status").textContent = "Done";
    } catch (error) {
        $("status").innerHTML = `<span class="error">${esc(error.message)}</span>`;
    } finally {
        clearInterval(timer);
        button.disabled = false;
    }
}

// Source checkboxes. A source whose .env keys are missing is shown but can't be ticked.
const CHOICES_KEY = "hotel-search-choices-v2";   // bumped so earlier unticked boxes reset to on

function savedChoices() {
    try {
        return JSON.parse(localStorage.getItem(CHOICES_KEY)) || {};
    } catch {
        return {};
    }
}

function saveChoices() {
    const choices = Object.fromEntries([...document.querySelectorAll("#sources input")].map(box => [box.value, box.checked]));
    try {
        localStorage.setItem(CHOICES_KEY, JSON.stringify(choices));
    } catch {
        // Storage blocked - the choices just won't be remembered
    }
}

function badge(cost) {
    return cost ? `<span class="badge ${esc(cost.kind)}" title="${esc(cost.note)}">${esc(cost.label)}</span>` : "";
}

function checkbox({ value, label, detail, cost, missing, checked, className = "" }) {
    const off = missing.length > 0;
    const note = off ? `missing ${missing.join(", ")} in .env` : detail;
    return `<label class="${className} ${off ? "off" : ""}">
        <input type="checkbox" value="${esc(value)}" ${checked && !off ? "checked" : ""} ${off ? "disabled" : ""}>
        <span>${esc(label)} ${badge(cost)} <span class="muted">${esc(note)}</span></span>
    </label>`;
}

async function loadSources() {
    try {
        const response = await fetch("/api/sources");
        const { sources, places } = await response.json();
        const saved = savedChoices();

        $("sources").classList.remove("muted");
        $("sources").innerHTML = sources
            .map(source => checkbox({ value: source.name, label: source.label, detail: source.detail, cost: source.cost, missing: source.missing, checked: saved[source.name] ?? source.defaultOn }))
            .join("")
            + checkbox({ value: "places", label: "Google Places", detail: "phones, addresses, city check", cost: places.cost, missing: places.missing, checked: saved.places ?? true, className: "places" });
        $("sources").addEventListener("change", saveChoices);
    } catch (error) {
        $("sources").textContent = `Could not load the source list: ${error.message}`;
    }
}

// The ticked sources, plus whether to look hotels up in Google Places (phones, addresses, city check)
function pickedSources() {
    const ticked = [...document.querySelectorAll("#sources input:checked")].map(box => box.value);
    return { sources: ticked.filter(value => value !== "places"), places: ticked.includes("places") };
}

loadSources();

async function runBackboard(text) {
    const button = $("bbRun");
    const started = Date.now();
    button.disabled = true;
    $("bbOutput").innerHTML = "";
    const timer = setInterval(() => $("bbStatus").textContent = `Asking Backboard… ${Math.round((Date.now() - started) / 1000)}s (web search, can take a minute)`, 500);

    try {
        const response = await fetch("/api/backboard", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: text })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        const { run } = data;
        $("bbOutput").innerHTML = `
            <div class="card">
                ${data.hotels.length ? renderTable(data.hotels) : "<p>Backboard found no hotels.</p>"}
                <p class="muted">${data.hotels.length} shown · the model returned ${run.returned} · ${data.seconds.toFixed(1)}s · ${esc(run.model)} · ${run.inputTokens ?? "?"} in / ${run.outputTokens ?? "?"} out tokens</p>
                ${run.dropped.length ? `<p class="error">Dropped: ${run.dropped.map(entry => `${esc(entry.name ?? "?")} (${esc(entry.reason)})`).join(", ")}</p>` : ""}
                <details><summary class="muted">What the model replied</summary><pre>${esc(run.reply)}</pre></details>
            </div>`;
        $("bbStatus").textContent = "Done";
    } catch (error) {
        $("bbStatus").innerHTML = `<span class="error">${esc(error.message)}</span>`;
    } finally {
        clearInterval(timer);
        button.disabled = false;
    }
}

// Two steps per box: "Review prompt" shows the full prompt that will run (nothing is searched yet),
// the "Run" button in the review panel then runs exactly that text.
const BOXES = {
    search: { input: "prompt", button: "run", status: "status", panel: "review", go: run, verb: "Run search" },
    backboard: { input: "bbPrompt", button: "bbRun", status: "bbStatus", panel: "bbReview", go: runBackboard, verb: "Ask Backboard" }
};

function showReview(box, data) {
    const usage = data.usage ? ` · ${data.usage.input_tokens + data.usage.output_tokens} tokens` : "";
    const hint = data.target === "search" ? " Edit the --flags to change a setting." : "";
    $(box.panel).innerHTML = `
        <div class="card review">
            <h2>Prompt that will run</h2>
            ${data.warnings.map(warning => `<p class="error">${esc(warning)}</p>`).join("")}
            <textarea id="${box.panel}Text">${esc(data.prompt)}</textarea>
            ${data.assumed.length ? `<p class="muted">Filled in because the request didn't say: ${data.assumed.map(esc).join(" · ")}</p>` : ""}
            <div class="bar">
                <button id="${box.panel}Go">${box.verb}</button>
                <button id="${box.panel}Cancel" class="secondary">Cancel</button>
                <span class="muted">Rewritten by ${esc(data.parser)}${usage}. Nothing has been searched yet.${hint}</span>
            </div>
        </div>`;

    const proceed = () => {
        const text = $(`${box.panel}Text`).value;
        $(box.panel).innerHTML = "";
        box.go(text);
    };
    $(`${box.panel}Go`).addEventListener("click", proceed);
    $(`${box.panel}Cancel`).addEventListener("click", () => {
        $(box.panel).innerHTML = "";
        $(box.status).textContent = "Cancelled";
    });
    $(`${box.panel}Text`).addEventListener("keydown", event => {
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) proceed();
    });
}

async function review(target) {
    const box = BOXES[target];
    $(box.button).disabled = true;
    $(box.panel).innerHTML = "";
    $(box.status).textContent = "Preparing the prompt…";

    try {
        const response = await fetch("/api/refine", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: $(box.input).value, target })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        showReview(box, data);
        $(box.status).textContent = "Check the prompt below, edit it if needed, then run it.";
    } catch (error) {
        $(box.status).innerHTML = `<span class="error">${esc(error.message)}</span>`;
    } finally {
        $(box.button).disabled = false;
    }
}

for (const [target, box] of Object.entries(BOXES)) {
    $(box.button).addEventListener("click", () => review(target));
    $(box.input).addEventListener("keydown", event => {
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) review(target);
    });
}
</script>
</body>
</html>
